<!doctype html><meta charset="utf-8"><title>滑鼠鎖定實測</title><style>body{font:16px system-ui;margin:40px;background:#e7f2e8;color:#182e29}button,a{display:inline-block;padding:14px;margin:8px;background:#fff;border:1px solid #9ab;border-radius:10px}pre{white-space:pre-wrap;padding:20px;background:#fff;border-radius:16px}#pad{height:140px;background:#bee975;padding:20px;border-radius:16px}</style><h1>原生滑鼠鎖定實測</h1><p>Esc 解除鎖定。只有瀏覽器確認 pointerLockElement 後才顯示成功。</p><button id="normal">測試一般鎖定</button><button id="raw">測試原始輸入鎖定</button><button id="full">進入全螢幕</button><a href="/">返回遊戲</a><div id="pad" tabindex="-1">鎖定目標區</div><pre id="result">尚未測試</pre><script>
const pad=document.getElementById('pad'),result=document.getElementById('result');let moves=0;
function report(message){result.textContent=message+'\n'+JSON.stringify({focused:document.hasFocus(),visible:document.visibilityState,connected:pad.isConnected,fullscreen:!!document.fullscreenElement,locked:document.pointerLockElement?.id||null,movements:moves});}
async function lock(raw){window.focus();pad.focus();try{await pad.requestPointerLock(raw?{unadjustedMovement:true}:{});report(document.pointerLockElement===pad?'鎖定成功':'等待瀏覽器鎖定事件');}catch(error){report(error.name+': '+error.message);}}
document.getElementById('normal').onclick=()=>lock(false);document.getElementById('raw').onclick=()=>lock(true);document.getElementById('full').onclick=async()=>{try{await document.documentElement.requestFullscreen();report('已進入全螢幕，點擊鎖定測試');}catch(error){report(error.name+': '+error.message);}};
document.addEventListener('pointerlockchange',()=>report(document.pointerLockElement===pad?'鎖定成功':'已解除鎖定'));document.addEventListener('mousemove',e=>{if(document.pointerLockElement===pad){moves++;report('鎖定成功：已收到相對滑鼠移動 '+e.movementX+', '+e.movementY);}});
</script>
